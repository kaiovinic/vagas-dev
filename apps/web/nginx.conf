# Serve o SPA e repassa /api para o container da API.
#
# O frontend chama caminhos relativos (`/api/jobs`, `/api/dashboard/summary`),
# nunca uma URL absoluta. Em desenvolvimento quem repassa e o proxy do Vite; em
# producao e este bloco. Consequencia pratica: tudo vem da mesma origem, e nao
# existe CORS nem `VITE_API_URL` para configurar no build.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamanho de corpo suficiente para as requisicoes da API (nenhum upload).
    client_max_body_size 1m;

    # O Nginx ja esta atras de um proxy com SSL; nao anuncia a versao.
    server_tokens off;

    # Os headers de seguranca ficam no Caddy, na borda. Aqui eles seriam
    # perdidos: no nginx, um `add_header` dentro de um `location` descarta
    # todos os herdados do `server` — e o fallback do SPA cai justamente no
    # `location = /index.html`, que tem add_header proprio.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Healthcheck do container: nao depende do SPA nem da API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolucao dinamica pelo DNS interno do Docker. Com `proxy_pass` fixo,
        # o Nginx resolve o nome uma unica vez no boot e passa a devolver 502
        # depois de um `docker compose restart api`, que troca o IP do container.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3333;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A captura manual varre cinco fontes e passa de um minuto; o padrao de
        # 60s cortaria a resposta no meio.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }

    # Estaticos do Vite levam hash no nome, logo o conteudo de uma URL nunca
    # muda: cache longo e seguro e evita revalidacao a cada navegacao.
    location /assets/ {
        # Um unico Cache-Control: `expires` tambem emite esse header, e junto
        # com o add_header a resposta sairia com dois, em desacordo entre si.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # O index.html NAO pode ser cacheado: e ele que aponta para os bundles com
    # hash novo. Cacheado, o navegador continuaria pedindo os arquivos antigos
    # depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Fallback do SPA: as rotas do React Router nao existem como arquivo.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
