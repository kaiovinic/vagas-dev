<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 240" fill="none">
  <defs>
    <!-- Gradiente do Ícone e Radares -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <!-- Gradiente do Texto DEV -->
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#00D2A0" />
    </linearGradient>

    <!-- Efeito de Brilho Sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Grupo do Símbolo (Radar / Pin / Lupa / Code) -->
  <g transform="translate(40, 20)">
    <!-- Ondas de Radar (Esquerda) -->
    <path d="M 50 75 A 55 55 0 0 0 50 145" stroke="url(#primaryGlow)" stroke-width="5" stroke-linecap="round" opacity="0.4" />
    <path d="M 32 60 A 78 78 0 0 0 32 160" stroke="url(#primaryGlow)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M 14 45 A 100 100 0 0 0 14 175" stroke="url(#primaryGlow)" stroke-width="4" stroke-linecap="round" opacity="0.3" />

    <!-- Ondas de Radar (Direita) -->
    <path d="M 170 75 A 55 55 0 0 1 170 145" stroke="url(#primaryGlow)" stroke-width="5" stroke-linecap="round" opacity="0.4" />
    <path d="M 188 60 A 78 78 0 0 1 188 160" stroke="url(#primaryGlow)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M 206 45 A 100 100 0 0 1 206 175" stroke="url(#primaryGlow)" stroke-width="4" stroke-linecap="round" opacity="0.3" />

    <!-- Estrutura do Pin / Localizador Geométrico -->
    <path d="M 110 195 L 85 145 M 110 195 L 135 145" stroke="url(#primaryGlow)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="110" cy="195" r="4" fill="#00F5FF" />
    <circle cx="85" cy="145" r="3.5" fill="#7B2CBF" />
    <circle cx="135" cy="145" r="3.5" fill="#00A8FF" />

    <!-- Anel Principal (Lupa / Foco) -->
    <circle cx="110" cy="105" r="50" stroke="url(#primaryGlow)" stroke-width="9" filter="url(#glow)" />
    
    <!-- Haste da Lupa -->
    <path d="M 72 142 L 50 164" stroke="#00A8FF" stroke-width="9" stroke-linecap="round" />

    <!-- Tags de Código { / } Centralizadas -->
    <text x="110" y="117" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#00F5FF" text-anchor="middle" letter-spacing="1">
      {<tspan fill="#FFFFFF">/</tspan>}
    </text>
  </g>

  <!-- Grupo Tipográfico: VAGAS DEV -->
  <g transform="translate(300, 138)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="78" letter-spacing="2">
      <tspan fill="#FFFFFF">VAGAS</tspan>
      <tspan fill="url(#devGradient)">DEV</tspan>
    </text>
  </g>
</svg>