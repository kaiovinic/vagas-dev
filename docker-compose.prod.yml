# Producao. Sobe com:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Nenhum servico publica porta no host exceto o proxy: o PostgreSQL e a API
# existem apenas dentro das redes do compose.

# Sem `container_name`: o compose nomeia como <projeto>-<servico>-1, o que evita
# colisao com o `docker-compose.yml` de desenvolvimento, que usa nomes fixos.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Sem `:?` o compose assumiria string vazia e o banco subiria sem senha.
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env.prod}
      TZ: America/Bahia
      PGTZ: America/Bahia
    volumes:
      - devradar-postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      # Contexto na raiz: o package-lock.json e unico para os dois workspaces.
      context: .
      dockerfile: apps/api/Dockerfile
    image: devradar-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      TZ: America/Bahia
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Sem estas duas a API sobe, avisa em WARN no boot e nao alerta ninguem.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Sem esta, o coletor de publicacoes do LinkedIn vira no-op silencioso e
      # as outras sete fontes seguem normalmente.
      SERP_API_KEY: ${SERP_API_KEY:-}
      SERP_ENDPOINT: ${SERP_ENDPOINT:-}
      # Sem esta, a geracao de curriculo responde 502 e o resto segue igual.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Vazio usa o padrao do codigo: so precisa de valor para trocar de modelo.
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Tenants da InHire. Vazio usa a lista semente do coletor.
      INHIRE_TENANTS: ${INHIRE_TENANTS:-}
      # Endereco do worker de publicacoes logadas. Vazio desliga a fonte, como
      # a SERP_API_KEY: ambiente sem a variavel simplesmente nao a tem.
      #
      # O default aqui NAO e vazio por descuido: apontar para o servico sempre
      # que ele existe na rede e o comportamento desejado, e quem nao quer a
      # fonte derruba o servico, nao a variavel.
      LINKEDIN_POSTS_WORKER_URL: ${LINKEDIN_POSTS_WORKER_URL:-http://posts-worker:4000}
      # Mesma origem via Nginx; so precisa de valor se a API for exposta direto.
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
    depends_on:
      postgres:
        # O entrypoint roda `prisma migrate deploy` antes do servidor: comecar
        # antes do banco aceitar conexao faria o container morrer em loop.
        condition: service_healthy
    networks:
      # `data` alcanca o PostgreSQL; `backend` da saida para a internet, que os
      # coletores precisam para raspar as fontes de vagas.
      - data
      - backend
    # O healthcheck vem do Dockerfile (GET /api/health, que consulta o banco).

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: devradar-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - edge

  # Coletor de publicacoes com sessao logada (RFC 001). Imagem propria porque o
  # Chromium do Playwright nao sobe na musl do Alpine da API — separacao por
  # incompatibilidade, nao por preferencia.
  posts-worker:
    build:
      context: .
      dockerfile: apps/posts-worker/Dockerfile
    image: devradar-posts-worker:latest
    restart: unless-stopped
    environment:
      TZ: America/Bahia
      POSTS_WORKER_PORT: 4000
      POSTS_WORKER_DATA_DIR: /data
      # Limites rigidos da colheita (RFC 001, secao 8). Vazio usa o padrao do
      # codigo; valor invalido tambem, em vez de derrubar o boot.
      LINKEDIN_POSTS_MAX_SCROLLS: ${LINKEDIN_POSTS_MAX_SCROLLS:-}
      LINKEDIN_POSTS_PER_QUERY: ${LINKEDIN_POSTS_PER_QUERY:-}
      LINKEDIN_POSTS_TIMEOUT_MS: ${LINKEDIN_POSTS_TIMEOUT_MS:-}
      # Cadencia do agendador que vive dentro do worker. Vazio usa 8 h com 20
      # min de sorteio para cada lado (RFC 001, secao 14).
      HARVEST_INTERVAL_HOURS: ${HARVEST_INTERVAL_HOURS:-}
      HARVEST_JITTER_MINUTES: ${HARVEST_JITTER_MINUTES:-}
      # Segredo opcional do POST /harvest. Vazio: protegido so pela rede, que
      # aqui basta — este servico nao publica porta no host.
      HARVEST_TRIGGER_TOKEN: ${HARVEST_TRIGGER_TOKEN:-}
    # Sem porta no host: so a API o alcanca, pela rede `backend`. O que ele
    # serve e cache de vaga, mas o volume dele guarda a sessao da conta.
    networks:
      - backend
    volumes:
      # Volume nomeado, e nao bind mount como em desenvolvimento: aqui o login
      # acontece DENTRO do contêiner, por noVNC (RFC 001, secao 6.1), e o
      # `state.json` nasce no proprio volume. Ele e a credencial da conta —
      # nunca entra em imagem, em log ou em backup que saia da VPS.
      - devradar-linkedin-session:/data
    # Os 64 MB padrao de /dev/shm fazem o Chromium quebrar em pagina pesada.
    shm_size: '1gb'
    # Protege o vizinho na VPS compartilhada: se o Chromium vazar, o OOM killer
    # pega o worker e nao o PostgreSQL.
    mem_limit: 900m

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      # Dominio real em producao; `localhost` para validar na maquina local.
      DEVRADAR_DOMAIN: ${DEVRADAR_DOMAIN:?defina DEVRADAR_DOMAIN no .env.prod}
      # E-mail do Let's Encrypt. O default nao e cosmetico: o Caddyfile usa a
      # diretiva `email`, que nao aceita valor vazio e derruba o proxy em loop
      # de parse se ACME_EMAIL ficar em branco.
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DEVRADAR_DOMAIN}}
      # Autenticacao basica do painel. Sem as duas o compose para aqui, com a
      # mensagem abaixo, em vez de publicar um painel aberto: a falha acontece
      # antes de qualquer container ser tocado, entao a versao no ar continua
      # de pe enquanto o .env.prod nao recebe os valores.
      DEVRADAR_AUTH_USER: ${DEVRADAR_AUTH_USER:?defina DEVRADAR_AUTH_USER no .env.prod}
      DEVRADAR_AUTH_HASH: ${DEVRADAR_AUTH_HASH:?defina DEVRADAR_AUTH_HASH no .env.prod - hash do caddy hash-password, com os cifroes dobrados}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chaves de conta: sem persistir, cada restart pede
      # certificado novo e bate no rate limit do Let's Encrypt.
      - devradar-caddy-data:/data
      - devradar-caddy-config:/config
    depends_on:
      - web
    networks:
      - edge

volumes:
  devradar-postgres-data:
  devradar-caddy-data:
  devradar-caddy-config:
  # Sessao do LinkedIn e ultima colheita. O servico e descartavel; este volume
  # nao: perde-lo significa refazer o login por noVNC.
  devradar-linkedin-session:

networks:
  # Sem saida para a internet: o banco so conversa com a API.
  data:
    internal: true
  backend:
  edge:
