services:
  postgres:
    image: postgres:16-alpine
    container_name: devradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devradar
      POSTGRES_PASSWORD: devradar
      POSTGRES_DB: devradar
      TZ: America/Bahia
      PGTZ: America/Bahia
    ports:
      # Porta do host configuravel: em maquinas com um PostgreSQL ja instalado o
      # servico local ocupa a 5432 e vence o mapeamento do container.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - devradar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devradar -d devradar']
      interval: 10s
      timeout: 5s
      retries: 5

  # Coletor de publicacoes com sessao logada (RFC 001). Atras de um profile
  # para que `npm run db:up` continue subindo so o banco: a imagem tem 1,5 GB
  # por causa do Chromium, e quem nao esta mexendo na feature nao precisa dela.
  #
  #   docker compose --profile linkedin up -d --build posts-worker
  posts-worker:
    profiles: ['linkedin']
    build:
      # Contexto na raiz: o package-lock.json e unico para os tres workspaces.
      context: .
      dockerfile: apps/posts-worker/Dockerfile
    image: devradar-posts-worker:latest
    container_name: devradar-posts-worker
    restart: unless-stopped
    environment:
      TZ: America/Bahia
      POSTS_WORKER_PORT: 4000
      POSTS_WORKER_DATA_DIR: /data
    ports:
      # Preso ao 127.0.0.1: em desenvolvimento a API roda no host, e e de la que
      # vem o GET /posts. Fora da maquina ninguem alcanca.
      - '127.0.0.1:${POSTS_WORKER_PORT:-4000}:4000'
    volumes:
      # Bind mount, e nao volume nomeado: o `session:login` roda no host, com
      # janela aberta, e grava o `state.json` nesta pasta. Com volume nomeado a
      # sessao gerada no Windows ficaria invisivel para o container, e seria
      # preciso copia-la na mao a cada renovacao.
      #
      # A pasta esta no .gitignore e no .dockerignore: o `state.json` E a
      # credencial da conta.
      - ./apps/posts-worker/data:/data
    # Os 64 MB padrao de /dev/shm fazem o Chromium quebrar em pagina pesada. A
    # alternativa, `--disable-dev-shm-usage`, troca memoria por disco e deixa
    # tudo mais lento; com volume de uso tao baixo, prefiro dar a memoria.
    shm_size: '1gb'

volumes:
  devradar-postgres-data:
